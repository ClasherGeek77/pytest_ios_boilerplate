[pytest]
testpaths = tests
addopts = -ra --verbose --html=reports/report.html --self-contained-html
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
# the appium client warns about its own internals on every session here,
# there is nothing a test can do about it, so keep the report clean
filterwarnings =
    ignore:.*remote_server_addr in RemoteConnection.*:DeprecationWarning
    ignore:.*get_timeout.*RemoteConnection.*:DeprecationWarning
